<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Every route this shell serves is either past Start's active-Bill state
      or the plain SPA fallback shown before hydration — none of it should
      be indexed (ADR-0010). The one route that SHOULD be indexed, "/",

      distinct landing document (src/server/landingDocument.ts) that strips
      this tag back out. See docs/adr/0010-prerendered-landing-noindex-rest.md.
    -->
    <meta name="robots" content="noindex" />
    <title>Split Bill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
